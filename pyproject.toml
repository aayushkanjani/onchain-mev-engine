[project]
name = "onchain-mev-engine"
version = "0.1.0"
description = "Research-grade DeFi and MEV trading engine"
requires-python = ">=3.13"
dependencies = [
    "web3>=7.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]